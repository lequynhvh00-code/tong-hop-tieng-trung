<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b52">
<title>LÊ QUỲNH - TỔNG HỢP TIẾNG TRUNG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column}
body{font-family:"Arial","Tahoma","Segoe UI",sans-serif;background:#f5f8f5;color:#183b2f}
.app-header{position:relative;z-index:20;padding:10px 18px 11px;background:linear-gradient(135deg,#fbfcf8 0%,#f4f8ef 48%,#edf6f0 100%);border-bottom:1px solid #dce9df;box-shadow:0 5px 20px rgba(24,59,47,.08)}
.brand{max-width:1280px;margin:auto;height:82px;position:relative;display:flex;align-items:center;justify-content:center}
.logo{position:absolute;left:0;top:0;width:82px;height:82px;object-fit:contain}
.title{margin:0;padding:0 100px;text-align:center;color:#17634d;font-size:clamp(24px,3.4vw,39px);line-height:1.12;font-weight:950}
.subtitle{position:absolute;bottom:0;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-size:12px;color:#718078;font-weight:650}
.main-nav{max-width:1280px;margin:9px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.main-nav button{border:1px solid #d7e7de;border-radius:13px;padding:10px 12px;background:#fff;color:#17634d;font-size:15px;font-weight:850;cursor:pointer;box-shadow:0 3px 10px rgba(24,59,47,.05)}
.main-nav button.active{background:#176b52;color:#fff;border-color:#176b52}
.frame-wrap{flex:1;min-height:0;height:auto;width:100%;position:relative;background:#fff}
.panel-frame{display:none;width:100%;height:100%;border:0;background:#fff}
.panel-frame.active{display:block}
@media(max-width:760px){
 .app-header{padding:6px 8px 7px}
 .brand{height:57px}
 .logo{width:56px;height:56px}
 .title{font-size:19px;padding:0 12px 10px 65px}
 .subtitle{font-size:9px}
 .main-nav{margin-top:6px;gap:5px}
 .main-nav button{font-size:12px;padding:8px 3px;border-radius:10px}
 .frame-wrap{flex:1;min-height:0;height:auto}
}

/* ===== THANH TIM KIEM CHUNG ===== */
.global-search-wrap{max-width:1280px;margin:9px auto 0;position:relative;z-index:30}
.global-search{width:100%;height:42px;padding:0 44px 0 16px;border:1px solid #d4e4db;border-radius:13px;background:#fff;color:#183b2f;font:700 15px Arial,Tahoma,sans-serif;outline:none;box-shadow:0 3px 10px rgba(24,59,47,.05)}
.global-search:focus{border-color:#63a98a;box-shadow:0 0 0 3px rgba(47,157,115,.12)}
.global-search-icon{position:absolute;right:13px;top:8px;font-size:22px;pointer-events:none}
.global-results{display:none;position:absolute;left:0;right:0;top:47px;max-height:min(62vh,520px);overflow:auto;background:#fff;border:1px solid #d9e7df;border-radius:14px;box-shadow:0 14px 35px rgba(24,59,47,.16);padding:6px}
.global-results.show{display:block}
.global-result{display:block;width:100%;border:0;border-bottom:1px solid #edf3ef;background:#fff;text-align:left;padding:10px 12px;cursor:pointer;border-radius:10px;font-family:Arial,Tahoma,sans-serif}
.global-result:hover{background:#f2f8f4}.global-result:last-child{border-bottom:0}
.result-top{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.result-word{font-family:"KaiTi","楷体","STKaiti","Kaiti SC",serif;font-size:24px;font-weight:900;color:#176b52}
.result-py{font-size:14px;font-weight:800;color:#527267}
.result-source{margin-left:auto;font-size:12px;font-weight:800;color:#8a6a39;background:#fff7e8;padding:4px 7px;border-radius:999px}
.result-meaning{margin-top:3px;color:#66766f;font-size:13px;line-height:1.45}
.global-empty{padding:16px;text-align:center;color:#718078;font-size:14px}
.global-count{padding:6px 9px;color:#718078;font-size:12px;border-bottom:1px solid #edf3ef}
@media(max-width:760px){.global-search-wrap{margin-top:6px}.global-search{height:38px;font-size:13px}.global-results{top:43px;max-height:58vh}.result-word{font-size:21px}.result-source{margin-left:0}}
</style>
</head>
<body>
<header class="app-header">
 <div class="brand">
  <img class="logo" src="assets/logo.webp" alt="Lê Quỳnh">
  <h1 class="title">LÊ QUỲNH - TỔNG HỢP TIẾNG TRUNG</h1>
  <p class="subtitle">Học tiếng Trung mọi lúc, mọi nơi • Ôn tập • Phát âm • Luyện viết</p>
 </div>
 <nav class="main-nav">
  <button class="active" data-target="han">📖 Ôn tập Hán Ngữ</button>
  <button data-target="hsk">🎓 Ôn tập HSK 2.0</button>
  <button data-target="pinyin">🔊 Luyện Pinyin</button>
 </nav>
<div class="global-search-wrap">
 <input id="globalSearch" class="global-search" type="search" autocomplete="off" placeholder="🔎 Tra toàn bộ từ vựng Hán Ngữ + HSK 2.0...">
 <span class="global-search-icon">⌕</span>
 <div id="globalResults" class="global-results"></div>
</div>
</header>
<main class="frame-wrap">
 <iframe id="frame-han" class="panel-frame active" title="Ôn tập Hán Ngữ"></iframe>
 <iframe id="frame-hsk" class="panel-frame" title="Ôn tập HSK 2.0"></iframe>
 <iframe id="frame-pinyin" class="panel-frame" title="Luyện Pinyin"></iframe>
</main>
<script>
const frames={
  han:document.getElementById("frame-han"),
  hsk:document.getElementById("frame-hsk"),
  pinyin:document.getElementById("frame-pinyin")
};
const loaded={};
function loadPanel(key){
  if(loaded[key]) return Promise.resolve();
  return new Promise(resolve=>{
    const f=frames[key];
    f.addEventListener("load",()=>{loaded[key]=true;resolve();},{once:true});
    f.src=key+"/index.html";
  });
}
function showPanel(key){
  Object.keys(frames).forEach(k=>frames[k].classList.toggle("active",k===key));
  document.querySelectorAll(".main-nav button").forEach(b=>b.classList.toggle("active",b.dataset.target===key));
  loadPanel(key);
}
document.querySelectorAll(".main-nav button").forEach(b=>b.addEventListener("click",()=>showPanel(b.dataset.target)));
loadPanel("han");

/* ===== TRA TU VUNG CHUNG =====
   Index được xây dựng từng bước để không khóa UI. */
const globalSearch=document.getElementById("globalSearch");
const globalResults=document.getElementById("globalResults");
let globalIndex=[];
let globalIndexReady=false;
let globalBuilding=false;
function normGlobal(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function sleepGlobal(ms){return new Promise(r=>setTimeout(r,ms))}
function readVocabFromFrame(key){
  const doc=frames[key].contentDocument;if(!doc)return [];
  const book=doc.getElementById("bookSelect");
  const bookValue=book?.value||"";
  const out=[];
  doc.querySelectorAll(".vocab-card").forEach(card=>{
    const word=(card.querySelector(".hanzi")?.textContent||card.getAttribute("data-word")||"").trim();
    const py=(card.querySelector(".py")?.textContent||"").trim();
    const meaning=(card.querySelector(".meaning")?.textContent||"").trim();
    const badge=(card.querySelector(".badge")?.textContent||"").trim();
    if(word)out.push({key,word,py,meaning,lesson:badge,bookValue});
  });
  return out;
}
async function buildOnePanel(key){
  await loadPanel(key);
  const f=frames[key];
  const doc=f.contentDocument;
  const sel=doc?.getElementById("bookSelect");
  if(sel&&sel.options.length){
    const original=sel.value;
    for(let i=0;i<sel.options.length;i++){
      sel.selectedIndex=i;
      sel.dispatchEvent(new Event("change",{bubbles:true}));
      await sleepGlobal(60);
      globalIndex.push(...readVocabFromFrame(key));
      await new Promise(requestAnimationFrame);
    }
    sel.value=original;sel.dispatchEvent(new Event("change",{bubbles:true}));
  }else globalIndex.push(...readVocabFromFrame(key));
}
async function buildGlobalIndex(){
  if(globalIndexReady||globalBuilding)return;
  globalBuilding=true;globalIndex=[];
  await buildOnePanel("han");
  await new Promise(requestAnimationFrame);
  await buildOnePanel("hsk");
  const seen=new Set();
  globalIndex=globalIndex.filter(x=>{const k=x.key+"|"+x.lesson+"|"+x.word+"|"+x.py+"|"+x.meaning;if(seen.has(k))return false;seen.add(k);return true});
  globalIndexReady=true;globalBuilding=false;
}
function escapeGlobal(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderGlobalResults(q){
  const nq=normGlobal(q);
  if(!nq){globalResults.classList.remove("show");globalResults.innerHTML="";return}
  if(!globalIndexReady){
    globalResults.innerHTML='<div class="global-empty">⏳ Đang chuẩn bị dữ liệu từ vựng...</div>';
    globalResults.classList.add("show");
    buildGlobalIndex().then(()=>renderGlobalResults(q));return;
  }
  const arr=globalIndex.filter(x=>normGlobal(x.word+" "+x.py+" "+x.meaning).includes(nq)).slice(0,80);
  let h='<div class="global-count">Tìm thấy '+arr.length+(arr.length>=80?"+":"")+' kết quả</div>';
  if(!arr.length)h+='<div class="global-empty">Không tìm thấy từ phù hợp.</div>';
  arr.forEach((x,i)=>{const source=x.key==="han"?"Ôn tập Hán Ngữ":"Ôn tập HSK 2.0";h+=`<button class="global-result" data-result-index="${i}"><div class="result-top"><span class="result-word">${escapeGlobal(x.word)}</span><span class="result-py">${escapeGlobal(x.py)}</span><span class="result-source">${source}</span></div><div class="result-meaning">${escapeGlobal(x.meaning)}${x.lesson?" • "+escapeGlobal(x.lesson):""}</div></button>`});
  globalResults.innerHTML=h;globalResults.classList.add("show");globalResults._current=arr;
}
globalSearch.addEventListener("input",()=>renderGlobalResults(globalSearch.value));
globalSearch.addEventListener("keydown",e=>{if(e.key==="Escape"){globalResults.classList.remove("show");globalSearch.blur()}});
globalResults.addEventListener("click",async e=>{
  const btn=e.target.closest(".global-result");if(!btn)return;
  const item=globalResults._current?.[Number(btn.dataset.resultIndex)];if(!item)return;
  showPanel(item.key);globalResults.classList.remove("show");
  await loadPanel(item.key);await sleepGlobal(80);
  const doc=frames[item.key].contentDocument,sel=doc?.getElementById("bookSelect");
  if(sel&&item.bookValue!=null&&sel.value!==item.bookValue){sel.value=item.bookValue;sel.dispatchEvent(new Event("change",{bubbles:true}));await sleepGlobal(80)}
  const card=[...(doc?.querySelectorAll(".vocab-card")||[])].find(c=>{const w=(c.querySelector(".hanzi")?.textContent||c.getAttribute("data-word")||"").trim();const m=(c.querySelector(".meaning")?.textContent||"").trim();return w===item.word&&(!item.meaning||m===item.meaning)});
  if(card){card.scrollIntoView({behavior:"smooth",block:"center"});card.style.outline="3px solid #7fc4a4";setTimeout(()=>card.style.outline="",1800)}
});
document.addEventListener("click",e=>{if(!e.target.closest(".global-search-wrap"))globalResults.classList.remove("show")});
</script>
</body>
</html>
